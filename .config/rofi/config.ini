@theme "onedark"

configuration {
  modi: "drun,run,window,combi";
  show-icons: true;
  icon-theme: "Adwaita";
  font: "Hurmit Nerd Font Mono 11";
  display-drun: "  Apps";
  display-run: "  Run";
  display-window: "  Windows";
  display-combi: "  All";
  combi-modi: "drun,window,run";
  sidebar-mode: false;
  location: 0;
  width: 60;
  lines: 12;
  columns: 1;
  scroll-method: 0;
  disable-history: false;
  hide-scrollbar: true;
}
