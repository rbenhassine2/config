backend = "glx"
vsync = false

shadow = true
shadow-radius = 7
shadow-offset-x = -15
shadow-offset-y = -15
shadow-opacity = 0.3
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'dunst'",
    "class_g = 'polybar'",
    "class_g = 'rofi'",
    "_NET_WM_WINDOW_TYPE = 'dock'"
]

fading = true
fade-in-step = 0.03
fade-out-step = 0.03

active-opacity = 1.0
inactive-opacity = 0.97
inactive-opacity-override = true

corner-radius = 8
round-borders = 1

detect-rounded-corners = true
