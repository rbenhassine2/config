[colors]
background = #282c34
background-alt = #2f3542
foreground = #abb2bf
foreground-alt = #dfe1e8
primary = #61afef
secondary = #c678dd
alert = #e06c75
success = #98c379
warning = #e5c07b

[bar/main]
monitor = ${env:MONITOR}
monitor-strict = false
monitor-fallback = HDMI-1-0
width = 100%
height = 26
radius = 0
fixed-center = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
line-color = ${colors.primary}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = "Hurmit Nerd Font Mono:size=10;3"
font-1 = "Hurmit Nerd Font Mono:size=9"
modules-left = workspaces
modules-center = title
modules-right = cpu temperature memory filesystem network pulseaudio battery date
tray-position = right
tray-padding = 3
cursor-click = pointer

[module/workspaces]
type = internal/i3
format = <label-state>
label-focused = " %index% "
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-underline = ${colors.primary}
label-unfocused = " %index% "
label-unfocused-foreground = ${colors.foreground}
label-urgent = " %index% "
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}

[module/title]
type = internal/xwindow
label = %title:0:80:...%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/temperature]
type = internal/temperature
zone-type = x86_pkg_temp
interval = 5
warn-temp = 80
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.alert}
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "  "
format-prefix-foreground = ${colors.secondary}
label = %used:8% / %total:8%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 25
format-prefix = "  "
format-prefix-foreground = ${colors.success}
label = %free%

[module/network]
type = internal/network
interface = enp12s0
interval = 3
format-connected = <label-connected>
label-connected =  %ifname% %local_ip%
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected =  down
label-disconnected-foreground = ${colors.alert}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.warning}
label-volume = %percentage%%
format-muted = <label-muted>
label-muted =  muted
label-muted-foreground = ${colors.alert}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 99
format-charging = <label-charging>
label-charging =  %percentage%%
label-charging-foreground = ${colors.success}
format-discharging = <label-discharging>
label-discharging =  %percentage%%
label-discharging-foreground = ${colors.foreground}
format-full-prefix = "  "
format-full-prefix-foreground = ${colors.success}
label-full = %percentage%%

[module/date]
type = internal/date
interval = 60
date = %a %d %b %Y
time = %H:%M
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %date% %time%
